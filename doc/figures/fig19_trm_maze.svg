<text x="58" y="418" class="cap">
<tspan x="58" dy="0"><tspan font-weight="600" fill="#1c2430">Six scribbles of thinking, then one stroke of the pencil.</tspan> That is one round. The scribbles are <tspan font-weight="600" fill="#1c2430">z</tspan> — dead ends you now remember, bits you are</tspan>
<tspan x="58" dy="20">unsure of — and they are never shown to anyone. The pencil line is <tspan font-weight="600" fill="#1c2430">y</tspan> , and it is the only thing anyone ever sees.</tspan>
<tspan x="58" dy="20"><tspan fill="#b4553f">Illustration of the idea, not model output.</tspan></tspan>
</text>
