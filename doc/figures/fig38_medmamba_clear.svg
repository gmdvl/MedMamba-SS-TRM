<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" width="1040" height="580" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6472"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2703a"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4e8c6a"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a5a92"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b4553f"/></marker><style>
  .t   {font-size:15px;fill:#1c2430}
  .tb  {font-size:15.5px;font-weight:600;fill:#1c2430}
  .ts  {font-size:12.5px;fill:#7b8794}
  .tsb {font-size:12.5px;font-weight:600;fill:#7b8794}
  .ti  {font-size:21px;font-weight:600;fill:#1c2430}
  .tsub{font-size:14px;fill:#7b8794}
  .big {font-size:30px;font-weight:600;fill:#1c2430}
  .huge{font-size:38px;font-weight:600;fill:#1c2430}
  .mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:13.5px;fill:#1c2430}
  .monb{font-family:"SFMono-Regular",Consolas,monospace;font-size:13.5px;font-weight:600;fill:#1c2430}
</style></defs>
<rect width="1040" height="580" fill="#ffffff"/>
<text x="30" y="38" class="ti" style="text-anchor:start">MedMamba — what each step actually does</text>
<text x="30" y="60" class="tsub" style="text-anchor:start">Two operations, repeated. One shrinks the grid; the other is the block that does the work.</text>
<text x="30" y="96" class="tsb" style="text-anchor:start">THE SHAPE</text>
<rect x="30" y="108" width="132" height="92" rx="7" fill="#f8e7e2" stroke="#b4553f" stroke-width="1.6"/>
<text x="96" y="132" class="ts" style="text-anchor:middle">cut into</text>
<text x="96" y="152" class="tb" style="text-anchor:middle;font-size:13.5px">4×4 patches</text>
<text x="96" y="173" class="ts" style="text-anchor:middle">each → 96 numbers</text>
<text x="96" y="193" class="tsb" style="text-anchor:middle;fill:#b4553f">the 3 lives here</text>
<rect x="186" y="108" width="150" height="92" rx="7" fill="#f2f4f7" stroke="#5a6472" stroke-width="1.6"/>
<text x="261" y="130" class="tb" style="text-anchor:middle;font-size:13.5px">stage 1</text>
<rect x="198" y="140" width="44" height="44" rx="2" fill="#ffffff" stroke="#5a6472" stroke-width="1.2"/>
<line x1="204.28571428571428" y1="140" x2="204.28571428571428" y2="184" stroke="#c9ced6" stroke-width="0.6" fill="none"/>
<line x1="198" y1="146.28571428571428" x2="242" y2="146.28571428571428" stroke="#c9ced6" stroke-width="0.6" fill="none"/>
<line x1="210.57142857142858" y1="140" x2="210.57142857142858" y2="184" stroke="#c9ced6" stroke-width="0.6" fill="none"/>
<line x1="198" y1="152.57142857142858" x2="242" y2="152.57142857142858" stroke="#c9ced6" stroke-width="0.6" fill="none"/>
<line x1="216.85714285714286" y1="140" x2="216.85714285714286" y2="184" stroke="#c9ced6" stroke-width="0.6" fill="none"/>
<line x1="198" y1="158.85714285714286" x2="242" y2="158.85714285714286" stroke="#c9ced6" stroke-width="0.6" fill="none"/>
<line x1="223.14285714285714" y1="140" x2="223.14285714285714" y2="184" stroke="#c9ced6" stroke-width="0.6" fill="none"/>
<line x1="198" y1="165.14285714285714" x2="242" y2="165.14285714285714" stroke="#c9ced6" stroke-width="0.6" fill="none"/>
<line x1="229.42857142857142" y1="140" x2="229.42857142857142" y2="184" stroke="#c9ced6" stroke-width="0.6" fill="none"/>
<line x1="198" y1="171.42857142857142" x2="242" y2="171.42857142857142" stroke="#c9ced6" stroke-width="0.6" fill="none"/>
<line x1="235.71428571428572" y1="140" x2="235.71428571428572" y2="184" stroke="#c9ced6" stroke-width="0.6" fill="none"/>
<line x1="198" y1="177.71428571428572" x2="242" y2="177.71428571428572" stroke="#c9ced6" stroke-width="0.6" fill="none"/>
<text x="252" y="156" class="ts" style="text-anchor:start">56×56 grid</text>
<text x="252" y="174" class="ts" style="text-anchor:start">96 numbers</text>
<text x="261" y="192" class="tsb" style="text-anchor:middle">× 2 blocks</text>
<line x1="340" y1="154" x2="368" y2="154" stroke="#5a6472" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<rect x="386" y="108" width="150" height="92" rx="7" fill="#f2f4f7" stroke="#5a6472" stroke-width="1.6"/>
<text x="461" y="130" class="tb" style="text-anchor:middle;font-size:13.5px">stage 2</text>
<rect x="398" y="140" width="34" height="34" rx="2" fill="#ffffff" stroke="#5a6472" stroke-width="1.2"/>
<line x1="409.3333333333333" y1="140" x2="409.3333333333333" y2="174" stroke="#c9ced6" stroke-width="0.6" fill="none"/>
<line x1="398" y1="151.33333333333334" x2="432" y2="151.33333333333334" stroke="#c9ced6" stroke-width="0.6" fill="none"/>
<line x1="420.6666666666667" y1="140" x2="420.6666666666667" y2="174" stroke="#c9ced6" stroke-width="0.6" fill="none"/>
<line x1="398" y1="162.66666666666666" x2="432" y2="162.66666666666666" stroke="#c9ced6" stroke-width="0.6" fill="none"/>
<text x="442" y="156" class="ts" style="text-anchor:start">28×28 grid</text>
<text x="442" y="174" class="ts" style="text-anchor:start">192 numbers</text>
<text x="461" y="192" class="tsb" style="text-anchor:middle">× 2 blocks</text>
<line x1="540" y1="154" x2="568" y2="154" stroke="#5a6472" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<rect x="586" y="108" width="150" height="92" rx="7" fill="#f2f4f7" stroke="#5a6472" stroke-width="1.6"/>
<text x="661" y="130" class="tb" style="text-anchor:middle;font-size:13.5px">stage 3</text>
<rect x="598" y="140" width="26" height="26" rx="2" fill="#ffffff" stroke="#5a6472" stroke-width="1.2"/>
<line x1="611.0" y1="140" x2="611.0" y2="166" stroke="#c9ced6" stroke-width="0.6" fill="none"/>
<line x1="598" y1="153.0" x2="624" y2="153.0" stroke="#c9ced6" stroke-width="0.6" fill="none"/>
<text x="634" y="156" class="ts" style="text-anchor:start">14×14 grid</text>
<text x="634" y="174" class="ts" style="text-anchor:start">384 numbers</text>
<text x="661" y="192" class="tsb" style="text-anchor:middle">× 4 blocks</text>
<line x1="740" y1="154" x2="768" y2="154" stroke="#5a6472" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<rect x="786" y="108" width="150" height="92" rx="7" fill="#f2f4f7" stroke="#5a6472" stroke-width="1.6"/>
<text x="861" y="130" class="tb" style="text-anchor:middle;font-size:13.5px">stage 4</text>
<rect x="798" y="140" width="20" height="20" rx="2" fill="#ffffff" stroke="#5a6472" stroke-width="1.2"/>
<line x1="808.0" y1="140" x2="808.0" y2="160" stroke="#c9ced6" stroke-width="0.6" fill="none"/>
<line x1="798" y1="150.0" x2="818" y2="150.0" stroke="#c9ced6" stroke-width="0.6" fill="none"/>
<text x="828" y="156" class="ts" style="text-anchor:start">7×7 grid</text>
<text x="828" y="174" class="ts" style="text-anchor:start">768 numbers</text>
<text x="861" y="192" class="tsb" style="text-anchor:middle">× 2 blocks</text>
<line x1="166" y1="154" x2="182" y2="154" stroke="#5a6472" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<rect x="30" y="216" width="906" height="40" rx="7" fill="#fbeee3" stroke="#c2703a" stroke-width="1.6"/>
<text x="483" y="241" class="t" style="text-anchor:middle">BETWEEN STAGES — patch merging: glue each 2×2 group of cells into one, then halve the result. Grid ÷ 2, numbers × 2.</text>
<rect x="952" y="108" width="58" height="92" rx="7" fill="#e8f3ed" stroke="#4e8c6a" stroke-width="1.6"/>
<text x="981" y="146" class="ts" style="text-anchor:middle">average</text>
<text x="981" y="164" class="ts" style="text-anchor:middle">+ one</text>
<text x="981" y="182" class="ts" style="text-anchor:middle">linear</text>
<line x1="940" y1="154" x2="948" y2="154" stroke="#5a6472" stroke-width="1.8" fill="none"/>
<text x="30" y="292" class="tsb" style="text-anchor:start">INSIDE ONE BLOCK — this is the part that does the work</text>
<rect x="30" y="306" width="118" height="78" rx="7" fill="#ffffff" stroke="#5a6472" stroke-width="1.6"/>
<text x="89" y="338" class="ts" style="text-anchor:middle">one cell,</text>
<text x="89" y="356" class="tb" style="text-anchor:middle;font-size:13.5px">96 numbers</text>
<line x1="152" y1="345" x2="184" y2="345" stroke="#5a6472" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<text x="168" y="330" class="ts" style="text-anchor:middle">split</text>
<rect x="192" y="300" width="300" height="40" rx="7" fill="#e8f3ed" stroke="#4e8c6a" stroke-width="1.6"/>
<text x="342" y="325" class="tb" style="text-anchor:middle;font-size:13.5px">first 48  →  SS2D</text>
<text x="192" y="360" class="ts" style="text-anchor:start">reads the WHOLE grid, four directions,</text>
<text x="192" y="378" class="ts" style="text-anchor:start">and remembers what it passed — long range.</text>
<rect x="192" y="396" width="300" height="40" rx="7" fill="#f2f4f7" stroke="#5a6472" stroke-width="1.6"/>
<text x="342" y="421" class="tb" style="text-anchor:middle;font-size:13.5px">other 48  →  3×3 convolution</text>
<text x="192" y="456" class="ts" style="text-anchor:start">sees only each cell’s neighbours — local detail.</text>
<line x1="496" y1="320" x2="528" y2="348" stroke="#5a6472" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<line x1="496" y1="416" x2="528" y2="388" stroke="#5a6472" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<rect x="536" y="336" width="132" height="64" rx="7" fill="#ffffff" stroke="#5a6472" stroke-width="1.6"/>
<text x="602" y="362" class="ts" style="text-anchor:middle">glue back</text>
<text x="602" y="382" class="ts" style="text-anchor:middle">to 96</text>
<line x1="672" y1="368" x2="704" y2="368" stroke="#5a6472" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<rect x="712" y="336" width="150" height="64" rx="7" fill="#fbeee3" stroke="#c2703a" stroke-width="1.6"/>
<text x="787" y="362" class="ts" style="text-anchor:middle">shuffle the</text>
<text x="787" y="382" class="tb" style="text-anchor:middle;font-size:13.5px">channels</text>
<line x1="866" y1="368" x2="898" y2="368" stroke="#5a6472" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<rect x="906" y="336" width="104" height="64" rx="7" fill="#ffffff" stroke="#5a6472" stroke-width="1.6"/>
<text x="958" y="372" class="tb" style="text-anchor:middle">out</text>
<text x="712" y="424" class="ts" style="text-anchor:start">so the two halves swap jobs</text>
<text x="712" y="442" class="ts" style="text-anchor:start">on the next block</text>
<rect x="30" y="486" width="980" height="44" rx="7" fill="#f2f4f7" stroke="#5a6472" stroke-width="1.6"/>
<text x="520.0" y="513.5" class="t" style="text-anchor:middle">A long-range operator and a local one for about the price of one. That economy is what we inherited — and did not touch.</text>
<text x="520" y="556" class="tsb" style="text-anchor:middle">Everything on this slide is MedMamba’s. The only part we change is the red box on the left.</text>
</svg>
