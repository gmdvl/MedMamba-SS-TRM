<text x="930" y="175" class="ts" style="text-anchor:start">0.742</text>
<text x="760" y="174" class="ts" style="text-anchor:end">24% of test</text>
<text x="760" y="210" class="t" style="text-anchor:end">DCIS</text>
<rect x="770" y="196" width="105.6" height="18" rx="3" fill="#e8f3ed" stroke="#4e8c6a" stroke-width="1.4"/>
<rect x="770" y="218" width="66.5" height="18" rx="3" fill="#f2f4f7" stroke="#7b8794" stroke-width="1.4"/>
<text x="930" y="209" class="ts" style="text-anchor:start">0.704</text>
<text x="930" y="231" class="ts" style="text-anchor:start">0.443</text>
<text x="760" y="230" class="ts" style="text-anchor:end">7% — the hard call</text>
<text x="760" y="266" class="t" style="text-anchor:end">IDC</text>
<rect x="770" y="252" width="149.8" height="18" rx="3" fill="#e8f3ed" stroke="#4e8c6a" stroke-width="1.4"/>
<rect x="770" y="274" width="149.8" height="18" rx="3" fill="#f2f4f7" stroke="#7b8794" stroke-width="1.4"/>
<text x="930" y="265" class="ts" style="text-anchor:start">0.999</text>
<text x="930" y="287" class="ts" style="text-anchor:start">0.999</text>
<text x="760" y="286" class="ts" style="text-anchor:end">69% of test</text>
<rect class="bx" x="30" y="318" width="980" height="44" fill="#f2f4f7" stroke="#5a6472"/>
<text x="520.0" y="344.5" class="t">Both models completely solve IDC — 69% of the test set says nothing about which is better.</text>
<rect class="bx" x="30" y="368" width="980" height="44" fill="#e8f3ed" stroke="#4e8c6a"/>
<text x="520.0" y="394.5" class="t">The whole margin is the healthy / DCIS boundary — which is the clinically consequential one.</text>
