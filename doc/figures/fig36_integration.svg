<text x="490" y="106" class="tsb" style="text-anchor:middle">one config flag</text>
<rect x="40" y="392" width="900" height="44" rx="7" fill="#f2f4f7" stroke="#5a6472" stroke-width="1.6"/>
<text x="490.0" y="419.5" class="t" style="text-anchor:middle">The swap is legal only because the interface did not move: same input shape, same output keys, same head, same trainer.</text>
