<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 380" width="1040" height="380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6472"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2703a"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4e8c6a"/></marker>
<marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a5a92"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b4553f"/></marker>
<style>
      .bx{stroke-width:1.6;rx:7}
      .t {font-size:15px;fill:#1c2430;text-anchor:middle}
      .ts{font-size:12.5px;fill:#7b8794;text-anchor:middle}
      .tb{font-size:15px;font-weight:600;fill:#1c2430;text-anchor:middle}
      .ti{font-size:21px;font-weight:600;fill:#1c2430}
      .tsub{font-size:14px;fill:#7b8794}
      .cap{font-size:13.5px;fill:#7b8794}
      .mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:13px;fill:#1c2430;text-anchor:middle}
      .c {stroke:#5a6472;stroke-width:1.8;fill:none;marker-end:url(#ar)}
      .co{stroke:#c2703a;stroke-width:2;fill:none;marker-end:url(#aro)}
      .cg{stroke:#4e8c6a;stroke-width:2;fill:none;marker-end:url(#arg)}
      .cp{stroke:#6a5a92;stroke-width:2;fill:none;marker-end:url(#arp)}
      .cr{stroke:#b4553f;stroke-width:2;fill:none;marker-end:url(#arr)}
      .plain{stroke:#5a6472;stroke-width:1.6;fill:none}
    </style>
</defs>
<rect width="1040" height="380" fill="#ffffff"/>
<text x="30" y="38" class="ti">Deep supervision — grade the working, not just the answer</text>
<text x="30" y="60" class="tsub">Run the loop several times. Check the answer after each. Cut the gradient in between.</text>
<rect class="bx" x="60" y="116" width="210" height="70" fill="#efecf6" stroke="#6a5a92"/>
<text x="165.0" y="147.5" class="t">segment 1</text>
<text x="165.0" y="167.5" class="ts">63 ÷ 3 = 21 calls to f</text>
<line class="cp" x1="165" y1="186" x2="165" y2="214"/>
<rect class="bx" x="90" y="216" width="150" height="44" fill="#f2f4f7" stroke="#5a6472"/>
<text x="165.0" y="242.5" class="t">head → loss</text>
<line x1="270" y1="151" x2="370" y2="151" stroke="#b4553f" stroke-width="2" stroke-dasharray="6 4"/>
<text x="320" y="142" class="ts">detach</text>
<text x="320" y="172" class="tb">✂</text>
<line class="c" x1="165" y1="260" x2="165" y2="292"/>
<rect class="bx" x="380" y="116" width="210" height="70" fill="#efecf6" stroke="#6a5a92"/>
<text x="485.0" y="147.5" class="t">segment 2</text>
<text x="485.0" y="167.5" class="ts">63 ÷ 3 = 21 calls to f</text>
<line class="cp" x1="485" y1="186" x2="485" y2="214"/>
<rect class="bx" x="410" y="216" width="150" height="44" fill="#f2f4f7" stroke="#5a6472"/>
<text x="485.0" y="242.5" class="t">head → loss</text>
<line x1="590" y1="151" x2="690" y2="151" stroke="#b4553f" stroke-width="2" stroke-dasharray="6 4"/>
<text x="640" y="142" class="ts">detach</text>
<text x="640" y="172" class="tb">✂</text>
<line class="c" x1="485" y1="260" x2="485" y2="292"/>
<rect class="bx" x="700" y="116" width="210" height="70" fill="#efecf6" stroke="#6a5a92"/>
<text x="805.0" y="147.5" class="t">segment 3</text>
<text x="805.0" y="167.5" class="ts">63 ÷ 3 = 21 calls to f</text>
<line class="cp" x1="805" y1="186" x2="805" y2="214"/>
<rect class="bx" x="730" y="216" width="150" height="44" fill="#f2f4f7" stroke="#5a6472"/>
<text x="805.0" y="242.5" class="t">head → loss</text>
<line class="c" x1="805" y1="260" x2="805" y2="292"/>
<rect class="bx" x="230" y="294" width="580" height="52" fill="#e8f3ed" stroke="#4e8c6a"/>
<text x="520.0" y="324.5" class="t">average the three losses  →  ONE backward pass</text>
<text x="30" y="366" class="cap">Without this you have a single loss at the end of a 63-deep chain. With it, every segment gets a training signal.</text>
</svg>