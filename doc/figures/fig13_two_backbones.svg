<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" width="1040" height="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6472"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2703a"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4e8c6a"/></marker>
<marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a5a92"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b4553f"/></marker>
<style>
      .bx{stroke-width:1.6;rx:7}
      .t {font-size:15px;fill:#1c2430;text-anchor:middle}
      .ts{font-size:12.5px;fill:#7b8794;text-anchor:middle}
      .tb{font-size:15px;font-weight:600;fill:#1c2430;text-anchor:middle}
      .ti{font-size:21px;font-weight:600;fill:#1c2430}
      .tsub{font-size:14px;fill:#7b8794}
      .cap{font-size:13.5px;fill:#7b8794}
      .mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:13px;fill:#1c2430;text-anchor:middle}
      .c {stroke:#5a6472;stroke-width:1.8;fill:none;marker-end:url(#ar)}
      .co{stroke:#c2703a;stroke-width:2;fill:none;marker-end:url(#aro)}
      .cg{stroke:#4e8c6a;stroke-width:2;fill:none;marker-end:url(#arg)}
      .cp{stroke:#6a5a92;stroke-width:2;fill:none;marker-end:url(#arp)}
      .cr{stroke:#b4553f;stroke-width:2;fill:none;marker-end:url(#arr)}
      .plain{stroke:#5a6472;stroke-width:1.6;fill:none}
    </style>
</defs>
<rect width="1040" height="400" fill="#ffffff"/>
<text x="30" y="38" class="ti">Two backbones, one flag</text>
<text x="30" y="60" class="tsub">Same spectral front end, same head, same trainer. Only the middle changes.</text>
<text x="30" y="100" class="tb" style="text-anchor:start">cfg.recursive = False   —   hierarchical</text>
<rect class="bx" x="40" y="112.0" width="170" height="78" fill="#f2f4f7" stroke="#5a6472"/>
<text x="125.0" y="147.5" class="t">96 ch</text>
<text x="125.0" y="167.5" class="ts">stage 1</text>
<line class="c" x1="210" y1="151" x2="234" y2="151"/>
<text x="222" y="142" class="ts">▼2</text>
<rect class="bx" x="238" y="118.0" width="144" height="66" fill="#f2f4f7" stroke="#5a6472"/>
<text x="310.0" y="147.5" class="t">192 ch</text>
<text x="310.0" y="167.5" class="ts">stage 2</text>
<line class="c" x1="382" y1="151" x2="406" y2="151"/>
<text x="394" y="142" class="ts">▼2</text>
<rect class="bx" x="410" y="124.0" width="120" height="54" fill="#f2f4f7" stroke="#5a6472"/>
<text x="470.0" y="147.5" class="t">384 ch</text>
<text x="470.0" y="167.5" class="ts">stage 3</text>
<line class="c" x1="530" y1="151" x2="554" y2="151"/>
<text x="542" y="142" class="ts">▼2</text>
<rect class="bx" x="558" y="130.0" width="98" height="42" fill="#f2f4f7" stroke="#5a6472"/>
<text x="607.0" y="147.5" class="t">768 ch</text>
<text x="607.0" y="167.5" class="ts">stage 4</text>
<text x="672" y="138" class="ts" style="text-anchor:start">12 distinct blocks, each stored once</text>
<rect class="bx" x="668" y="148" width="334" height="38" fill="#fbe9e4" stroke="#b4553f"/>
<text x="835.0" y="171.5" class="t">~27 M parameters  ⚠</text>
<line x1="30" y1="214" x2="1010" y2="214" stroke="#5a6472" stroke-width="1" stroke-dasharray="4 4"/>
<text x="30" y="248" class="tb" style="text-anchor:start">cfg.recursive = True   —   recursive (TRM)</text>
<rect class="bx" x="40" y="262" width="240" height="82" fill="#efecf6" stroke="#6a5a92"/>
<text x="160.0" y="290.0" class="t">one core</text>
<text x="160.0" y="309.0" class="t">2 blocks</text>
<text x="160.0" y="329.0" class="ts">width 128</text>
<path d="M110,344 C110,392 210,392 210,346" stroke="#6a5a92" stroke-width="2.2" fill="none" marker-end="url(#arp)"/>
<text x="160" y="388" class="tb">× 63</text>
<text x="320" y="288" class="ts" style="text-anchor:start">2 blocks, stored once, called 126 times</text>
<text x="320" y="314" class="ts" style="text-anchor:start">61× fewer parameters, identical interface</text>
<rect class="bx" x="668" y="284" width="334" height="38" fill="#e8f3ed" stroke="#4e8c6a"/>
<text x="835.0" y="307.5" class="t">446,409 parameters  ✓</text>
</svg>