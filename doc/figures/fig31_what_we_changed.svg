<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6472"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2703a"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4e8c6a"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a5a92"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b4553f"/></marker><style>
  .t   {font-size:15px;fill:#1c2430}
  .tb  {font-size:15.5px;font-weight:600;fill:#1c2430}
  .ts  {font-size:12.5px;fill:#7b8794}
  .tsb {font-size:12.5px;font-weight:600;fill:#7b8794}
  .ti  {font-size:21px;font-weight:600;fill:#1c2430}
  .tsub{font-size:14px;fill:#7b8794}
  .big {font-size:30px;font-weight:600;fill:#1c2430}
  .huge{font-size:38px;font-weight:600;fill:#1c2430}
  .mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:13.5px;fill:#1c2430}
  .monb{font-family:"SFMono-Regular",Consolas,monospace;font-size:13.5px;font-weight:600;fill:#1c2430}
</style></defs>
<rect width="1040" height="470" fill="#ffffff"/>
<text x="30" y="38" class="ti" style="text-anchor:start">What we changed from TRM, and why</text>
<text x="30" y="60" class="tsub" style="text-anchor:start">Five changes. We kept every part that Part 3 showed was load-bearing.</text>
<text x="232" y="106" class="tsb" style="text-anchor:middle">TRM</text>
<text x="560" y="106" class="tsb" style="text-anchor:middle">ours</text>
<text x="840" y="106" class="tsb" style="text-anchor:middle">why</text>
<text x="30" y="148" class="tb" style="text-anchor:start;font-size:14px">shape</text>
<rect x="146" y="128" width="172" height="34" rx="5" fill="#f2f4f7" stroke="#5a6472" stroke-width="1.2"/>
<text x="232" y="150" class="ts" style="text-anchor:middle">token sequence</text>
<line x1="326" y1="145" x2="352" y2="145" stroke="#c2703a" stroke-width="1.5" fill="none" marker-end="url(#aro)"/>
<rect x="360" y="128" width="200" height="34" rx="5" fill="#fbeee3" stroke="#c2703a" stroke-width="1.4"/>
<text x="460" y="150" class="ts" style="text-anchor:middle">2-D grid</text>
<text x="586" y="150" class="ts" style="text-anchor:start">we classify images</text>
<text x="30" y="202" class="tb" style="text-anchor:start;font-size:14px">mixer inside f</text>
<rect x="146" y="182" width="172" height="34" rx="5" fill="#f2f4f7" stroke="#5a6472" stroke-width="1.2"/>
<text x="232" y="204" class="ts" style="text-anchor:middle">self-attention</text>
<line x1="326" y1="199" x2="352" y2="199" stroke="#c2703a" stroke-width="1.5" fill="none" marker-end="url(#aro)"/>
<rect x="360" y="182" width="200" height="34" rx="5" fill="#fbeee3" stroke="#c2703a" stroke-width="1.4"/>
<text x="460" y="204" class="ts" style="text-anchor:middle">depthwise 3×3 conv</text>
<text x="586" y="204" class="ts" style="text-anchor:start">attention is overkill on 11×11 — and</text>
<text x="586" y="220" class="ts" style="text-anchor:start">their own ablation says the mixer is task-dependent</text>
<text x="30" y="256" class="tb" style="text-anchor:start;font-size:14px">passes</text>
<rect x="146" y="236" width="172" height="34" rx="5" fill="#f2f4f7" stroke="#5a6472" stroke-width="1.2"/>
<text x="232" y="258" class="ts" style="text-anchor:middle">16</text>
<line x1="326" y1="253" x2="352" y2="253" stroke="#c2703a" stroke-width="1.5" fill="none" marker-end="url(#aro)"/>
<rect x="360" y="236" width="200" height="34" rx="5" fill="#fbeee3" stroke="#c2703a" stroke-width="1.4"/>
<text x="460" y="258" class="ts" style="text-anchor:middle">3</text>
<text x="586" y="258" class="ts" style="text-anchor:start">63 calls to f, not 336</text>
<text x="30" y="310" class="tb" style="text-anchor:start;font-size:14px">deep supervision</text>
<rect x="146" y="290" width="172" height="34" rx="5" fill="#f2f4f7" stroke="#5a6472" stroke-width="1.2"/>
<text x="232" y="312" class="ts" style="text-anchor:middle">1 pass per step</text>
<line x1="326" y1="307" x2="352" y2="307" stroke="#c2703a" stroke-width="1.5" fill="none" marker-end="url(#aro)"/>
<rect x="360" y="290" width="200" height="34" rx="5" fill="#fbeee3" stroke="#c2703a" stroke-width="1.4"/>
<text x="460" y="312" class="ts" style="text-anchor:middle">all passes in one forward</text>
<text x="586" y="312" class="ts" style="text-anchor:start">keeps our per-batch checks working</text>
<text x="30" y="364" class="tb" style="text-anchor:start;font-size:14px">halting</text>
<rect x="146" y="344" width="172" height="34" rx="5" fill="#f2f4f7" stroke="#5a6472" stroke-width="1.2"/>
<text x="232" y="366" class="ts" style="text-anchor:middle">per sample, on</text>
<line x1="326" y1="361" x2="352" y2="361" stroke="#c2703a" stroke-width="1.5" fill="none" marker-end="url(#aro)"/>
<rect x="360" y="344" width="200" height="34" rx="5" fill="#fbeee3" stroke="#c2703a" stroke-width="1.4"/>
<text x="460" y="366" class="ts" style="text-anchor:middle">whole batch, OFF</text>
<text x="586" y="366" class="ts" style="text-anchor:start">sat at chance for 33 epochs</text>
<rect x="30" y="396" width="980" height="40" rx="7" fill="#e8f3ed" stroke="#4e8c6a" stroke-width="1.6"/>
<text x="520.0" y="421.5" class="t" style="text-anchor:middle">UNCHANGED: both lines, one shared network, additive inputs, 2 rounds under no_grad with a FULL round backpropagated, detach between passes.</text>
<text x="30" y="456" class="tsb" style="text-anchor:start">Say it before anyone catches you: we implemented TRM’s RECURSION, not TRM’s BLOCKS. They use attention; every real run of ours uses a convolution.</text>
</svg>
