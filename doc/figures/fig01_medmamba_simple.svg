<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" width="1040" height="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6472"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2703a"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4e8c6a"/></marker>
<marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a5a92"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b4553f"/></marker>
<style>
      .bx{stroke-width:1.6;rx:7}
      .t {font-size:15px;fill:#1c2430;text-anchor:middle}
      .ts{font-size:12.5px;fill:#7b8794;text-anchor:middle}
      .tb{font-size:15px;font-weight:600;fill:#1c2430;text-anchor:middle}
      .ti{font-size:21px;font-weight:600;fill:#1c2430}
      .tsub{font-size:14px;fill:#7b8794}
      .cap{font-size:13.5px;fill:#7b8794}
      .mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:13px;fill:#1c2430;text-anchor:middle}
      .c {stroke:#5a6472;stroke-width:1.8;fill:none;marker-end:url(#ar)}
      .co{stroke:#c2703a;stroke-width:2;fill:none;marker-end:url(#aro)}
      .cg{stroke:#4e8c6a;stroke-width:2;fill:none;marker-end:url(#arg)}
      .cp{stroke:#6a5a92;stroke-width:2;fill:none;marker-end:url(#arp)}
      .cr{stroke:#b4553f;stroke-width:2;fill:none;marker-end:url(#arr)}
      .plain{stroke:#5a6472;stroke-width:1.6;fill:none}
    </style>
</defs>
<rect width="1040" height="330" fill="#ffffff"/>
<text x="30" y="38" class="ti">MedMamba, simplified</text>
<text x="30" y="60" class="tsub">Four stages. The picture halves, the features double. Same skeleton as a ResNet or Swin.</text>
<rect class="bx" x="30" y="108" width="160" height="76" fill="#fbe9e4" stroke="#b4553f"/>
<text x="110.0" y="133.0" class="t">Patch Embed</text>
<text x="110.0" y="152.0" class="t">Conv2d(3→96)</text>
<text x="110.0" y="172.0" class="ts">stride 4</text>
<rect class="bx" x="214" y="108" width="148" height="76" fill="#f2f4f7" stroke="#5a6472"/>
<text x="288.0" y="133.0" class="t">Stage 1</text>
<text x="288.0" y="152.0" class="t">96 ch × 2 blocks</text>
<text x="288.0" y="172.0" class="ts">56×56</text>
<text x="374" y="140.0" class="ts">▼2</text>
<rect class="bx" x="386" y="108" width="148" height="76" fill="#f2f4f7" stroke="#5a6472"/>
<text x="460.0" y="133.0" class="t">Stage 2</text>
<text x="460.0" y="152.0" class="t">192 ch × 2</text>
<text x="460.0" y="172.0" class="ts">28×28</text>
<text x="546" y="140.0" class="ts">▼2</text>
<rect class="bx" x="558" y="108" width="148" height="76" fill="#f2f4f7" stroke="#5a6472"/>
<text x="632.0" y="133.0" class="t">Stage 3</text>
<text x="632.0" y="152.0" class="t">384 ch × 4</text>
<text x="632.0" y="172.0" class="ts">14×14</text>
<text x="718" y="140.0" class="ts">▼2</text>
<rect class="bx" x="730" y="108" width="148" height="76" fill="#f2f4f7" stroke="#5a6472"/>
<text x="804.0" y="133.0" class="t">Stage 4</text>
<text x="804.0" y="152.0" class="t">768 ch × 2</text>
<text x="804.0" y="172.0" class="ts">7×7</text>
<rect class="bx" x="902" y="108" width="112" height="76" fill="#e8f3ed" stroke="#4e8c6a"/>
<text x="958.0" y="133.0" class="t">AvgPool</text>
<text x="958.0" y="152.0" class="t">+ Linear</text>
<text x="958.0" y="172.0" class="ts">→ classes</text>
<line class="c" x1="190" y1="146.0" x2="208" y2="146.0"/>
<line class="c" x1="362" y1="146.0" x2="380" y2="146.0"/>
<line class="c" x1="534" y1="146.0" x2="552" y2="146.0"/>
<line class="c" x1="706" y1="146.0" x2="724" y2="146.0"/>
<line class="c" x1="878" y1="146.0" x2="896" y2="146.0"/>
<text x="30" y="96" class="ts" style="text-anchor:start">[B, 3, 224, 224]</text>
<text x="902" y="96" class="ts" style="text-anchor:start">[B, classes]</text>
<line class="cr" x1="110" y1="218" x2="110" y2="192"/>
<rect class="bx" x="30" y="220" width="470" height="46" fill="#fbe9e4" stroke="#b4553f"/>
<text x="265.0" y="247.5" class="t">⚠  in_chans = 3 is baked into this weight tensor:  [96, 3, 4, 4]</text>
<text x="30" y="300" class="cap">Between stages: PatchMerging2D — take every other pixel 4 ways, concatenate, halve with a Linear.</text>
</svg>