<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" width="1040" height="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6472"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2703a"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4e8c6a"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a5a92"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b4553f"/></marker><style>
  .t   {font-size:15px;fill:#1c2430}
  .tb  {font-size:15.5px;font-weight:600;fill:#1c2430}
  .ts  {font-size:12.5px;fill:#7b8794}
  .tsb {font-size:12.5px;font-weight:600;fill:#7b8794}
  .ti  {font-size:21px;font-weight:600;fill:#1c2430}
  .tsub{font-size:14px;fill:#7b8794}
  .big {font-size:30px;font-weight:600;fill:#1c2430}
  .huge{font-size:38px;font-weight:600;fill:#1c2430}
  .mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:13.5px;fill:#1c2430}
  .monb{font-family:"SFMono-Regular",Consolas,monospace;font-size:13.5px;font-weight:600;fill:#1c2430}
</style></defs>
<rect width="1040" height="400" fill="#ffffff"/>
<text x="30" y="38" class="ti" style="text-anchor:start">The proof: the same model, at 32 bands and at 3</text>
<text x="30" y="60" class="tsub" style="text-anchor:start">Same dataset, same three classes, same everything. Only the input directory differs.</text>
<rect x="70" y="100" width="360" height="170" rx="7" fill="#e8f3ed" stroke="#4e8c6a" stroke-width="1.6"/>
<text x="250" y="136" class="tb" style="text-anchor:middle;font-size:19px">32 bands</text>
<text x="250" y="158" class="ts" style="text-anchor:middle">hyperspectral cube</text>
<text x="250" y="212" class="huge" style="text-anchor:middle;fill:#4e8c6a">446,409</text>
<text x="250" y="240" class="ts" style="text-anchor:middle">trainable parameters</text>
<rect x="610" y="100" width="360" height="170" rx="7" fill="#e8f3ed" stroke="#4e8c6a" stroke-width="1.6"/>
<text x="790" y="136" class="tb" style="text-anchor:middle;font-size:19px">3 bands</text>
<text x="790" y="158" class="ts" style="text-anchor:middle">RGB rendering</text>
<text x="790" y="212" class="huge" style="text-anchor:middle;fill:#4e8c6a">446,409</text>
<text x="790" y="240" class="ts" style="text-anchor:middle">trainable parameters</text>
<text x="520" y="200" class="huge" style="text-anchor:middle;fill:#5a6472;font-size:52px">=</text>
<text x="520" y="236" class="tsb" style="text-anchor:middle">difference: 0</text>
<rect x="70" y="292" width="900" height="44" rx="7" fill="#e8f3ed" stroke="#4e8c6a" stroke-width="1.6"/>
<text x="520.0" y="319.5" class="tb" style="text-anchor:middle">Not “about the same”. Identical — this is arithmetic, not a measurement.</text>
<text x="520" y="368" class="ts" style="text-anchor:middle">The honest footnote: STORAGE is constant in band count. ACTIVATIONS are not — peak inference memory is 170 MB vs 63 MB.</text>
</svg>
