<text x="30" y="38" class="ti" style="text-anchor:start">Does it work? Yes — and here is the row that keeps you honest</text>
<text x="30" y="60" class="tsub" style="text-anchor:start">7 M parameters, about 1000 training examples. Every number is the paper’s.</text>
