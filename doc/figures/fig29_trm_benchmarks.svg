<text x="273.0" y="343.5" class="t" style="text-anchor:middle">On Sudoku and Maze every LLM here scores a flat 0.0.</text>
<rect x="524" y="316" width="486" height="44" rx="7" fill="#f8e7e2" stroke="#b4553f" stroke-width="1.6"/>
<text x="767.0" y="343.5" class="t" style="text-anchor:middle">Grok-4 beats it on ARC. The abstract says “most LLMs” and means it.</text>
<text x="520" y="392" class="ts" style="text-anchor:middle">Not generative — one input, one deterministic answer.   And bigger is worse: 4 layers lose to 2, and the authors say they have no theory why.</text>
<text x="520" y="416" class="tsb" style="text-anchor:middle">None of this is measured on medical images. We inherited the recursion, not the evidence.</text>
