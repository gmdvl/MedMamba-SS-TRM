<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6472"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2703a"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4e8c6a"/></marker>
<marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a5a92"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b4553f"/></marker>
<style>
      .bx{stroke-width:1.6;rx:7}
      .t {font-size:15px;fill:#1c2430;text-anchor:middle}
      .ts{font-size:12.5px;fill:#7b8794;text-anchor:middle}
      .tb{font-size:15px;font-weight:600;fill:#1c2430;text-anchor:middle}
      .ti{font-size:21px;font-weight:600;fill:#1c2430}
      .tsub{font-size:14px;fill:#7b8794}
      .cap{font-size:13.5px;fill:#7b8794}
      .mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:13px;fill:#1c2430;text-anchor:middle}
      .c {stroke:#5a6472;stroke-width:1.8;fill:none;marker-end:url(#ar)}
      .co{stroke:#c2703a;stroke-width:2;fill:none;marker-end:url(#aro)}
      .cg{stroke:#4e8c6a;stroke-width:2;fill:none;marker-end:url(#arg)}
      .cp{stroke:#6a5a92;stroke-width:2;fill:none;marker-end:url(#arp)}
      .cr{stroke:#b4553f;stroke-width:2;fill:none;marker-end:url(#arr)}
      .plain{stroke:#5a6472;stroke-width:1.6;fill:none}
    </style>
</defs>
<rect width="1040" height="470" fill="#ffffff"/>
<text x="30" y="38" class="ti">The block we inherited, and the three things we added</text>
<text x="30" y="60" class="tsub">Grey = MedMamba's SS_Conv_SSM, unchanged.   Orange = ours.</text>
<rect class="bx" x="220" y="92" width="300" height="38" fill="#f2f4f7" stroke="#5a6472"/>
<text x="370.0" y="115.5" class="t">input  [B, H, W, C]</text>
<line class="c" x1="370" y1="130" x2="370" y2="152"/>
<rect class="bx" x="200" y="154" width="340" height="38" fill="#fbeee3" stroke="#c2703a"/>
<text x="370.0" y="177.5" class="t">FiLM — scale + shift by the spectrum</text>
<circle cx="560" cy="173" r="14" fill="#c2703a" stroke="#c2703a"/>
<text x="560" y="179" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">1</text>
<text x="584" y="178" class="ts" style="text-anchor:start">the backbone is told about the spectrum</text>
<line class="c" x1="370" y1="192" x2="370" y2="224"/>
<text x="378" y="212" class="ts" style="text-anchor:start">chunk into two halves</text>
<rect class="bx" x="180" y="226" width="180" height="62" fill="#f2f4f7" stroke="#5a6472"/>
<text x="270.0" y="253.5" class="t">Conv 3×3 → 3×3 → 1×1</text>
<text x="270.0" y="273.5" class="ts">local</text>
<rect class="bx" x="380" y="226" width="180" height="62" fill="#fbeee3" stroke="#c2703a"/>
<text x="470.0" y="253.5" class="t">SS2D</text>
<text x="470.0" y="273.5" class="ts">long range</text>
<circle cx="580" cy="257" r="14" fill="#c2703a" stroke="#c2703a"/>
<text x="580" y="263" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">2</text>
<text x="604" y="262" class="ts" style="text-anchor:start">+ LayerScale, a learnable dial on the branch</text>
<line class="c" x1="370" y1="288" x2="370" y2="312"/>
<rect class="bx" x="180" y="314" width="380" height="38" fill="#f2f4f7" stroke="#5a6472"/>
<text x="370.0" y="337.5" class="t">concat → channel_shuffle → + input</text>
<line class="c" x1="370" y1="352" x2="370" y2="376"/>
<rect class="bx" x="220" y="378" width="300" height="38" fill="#fbeee3" stroke="#c2703a"/>
<text x="370.0" y="401.5" class="t">+ GatedMLP feed-forward</text>
<circle cx="540" cy="397" r="14" fill="#c2703a" stroke="#c2703a"/>
<text x="540" y="403" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">3</text>
<text x="564" y="402" class="ts" style="text-anchor:start">a feed-forward block, as a transformer has</text>
<text x="30" y="450" class="cap">The skeleton — split, conv one half, scan the other, concatenate, shuffle, residual — is MedMamba's and is untouched.</text>
</svg>