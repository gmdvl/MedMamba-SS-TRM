<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6472"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2703a"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4e8c6a"/></marker>
<marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a5a92"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b4553f"/></marker>
<style>
      .bx{stroke-width:1.6;rx:7}
      .t {font-size:15px;fill:#1c2430;text-anchor:middle}
      .ts{font-size:12.5px;fill:#7b8794;text-anchor:middle}
      .tb{font-size:15px;font-weight:600;fill:#1c2430;text-anchor:middle}
      .ti{font-size:21px;font-weight:600;fill:#1c2430}
      .tsub{font-size:14px;fill:#7b8794}
      .cap{font-size:13.5px;fill:#7b8794}
      .mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:13px;fill:#1c2430;text-anchor:middle}
      .c {stroke:#5a6472;stroke-width:1.8;fill:none;marker-end:url(#ar)}
      .co{stroke:#c2703a;stroke-width:2;fill:none;marker-end:url(#aro)}
      .cg{stroke:#4e8c6a;stroke-width:2;fill:none;marker-end:url(#arg)}
      .cp{stroke:#6a5a92;stroke-width:2;fill:none;marker-end:url(#arp)}
      .cr{stroke:#b4553f;stroke-width:2;fill:none;marker-end:url(#arr)}
      .plain{stroke:#5a6472;stroke-width:1.6;fill:none}
    </style>
</defs>
<rect width="1040" height="470" fill="#ffffff"/>
<text x="30" y="38" class="ti">The same thing, precisely</text>
<text x="30" y="60" class="tsub">Two lines of code. Each row below IS one of them.</text>
<text x="30" y="96" class="tb" style="text-anchor:start">① refine the scratchpad</text>
<rect class="bx" x="60" y="134" width="92" height="36" fill="#fbeee3" stroke="#c2703a"/>
<text x="106.0" y="156.5" class="mono">z</text>
<line class="c" x1="152" y1="152" x2="206" y2="166.0"/>
<rect class="bx" x="60" y="178" width="92" height="36" fill="#e8f3ed" stroke="#4e8c6a"/>
<text x="106.0" y="200.5" class="mono">y</text>
<line class="c" x1="152" y1="196" x2="206" y2="174.0"/>
<rect class="bx" x="60" y="222" width="92" height="36" fill="#f2f4f7" stroke="#5a6472"/>
<text x="106.0" y="244.5" class="mono">x</text>
<line class="c" x1="152" y1="240" x2="206" y2="182.0"/>
<circle cx="226" cy="178" r="19" fill="#ffffff" stroke="#5a6472" stroke-width="1.6"/>
<text x="226" y="185" text-anchor="middle" font-size="20" fill="#1c2430">+</text>
<line class="c" x1="245" y1="178" x2="314" y2="178"/>
<rect class="bx" x="318" y="132" width="150" height="92" fill="#efecf6" stroke="#6a5a92" stroke-width="2"/>
<text x="393" y="180" class="ti">f</text>
<text x="393" y="204" class="ts">2 layers</text>
<line class="cp" x1="468" y1="178" x2="546" y2="178"/>
<rect class="bx" x="550" y="160" width="92" height="36" fill="#fbeee3" stroke="#c2703a"/>
<text x="596.0" y="182.5" class="mono">z</text>
<text x="507" y="166" class="ts">× 6</text>
<rect class="bx" x="690" y="156" width="320" height="44" fill="#fbeee3" stroke="#c2703a"/>
<text x="850.0" y="182.5" class="mono">z = f(z + y + x)</text>
<text x="690" y="216" class="ts" style="text-anchor:start">six times per round</text>
<line x1="30" y1="286" x2="1010" y2="286" stroke="#5a6472" stroke-width="1" stroke-dasharray="4 4"/>
<text x="30" y="316" class="tb" style="text-anchor:start">② then refine the answer</text>
<rect class="bx" x="60" y="338" width="92" height="36" fill="#e8f3ed" stroke="#4e8c6a"/>
<text x="106.0" y="360.5" class="mono">y</text>
<line class="c" x1="152" y1="356" x2="206" y2="352.0"/>
<rect class="bx" x="60" y="382" width="92" height="36" fill="#fbeee3" stroke="#c2703a"/>
<text x="106.0" y="404.5" class="mono">z</text>
<line class="c" x1="152" y1="400" x2="206" y2="360.0"/>
<circle cx="226" cy="360" r="19" fill="#ffffff" stroke="#5a6472" stroke-width="1.6"/>
<text x="226" y="367" text-anchor="middle" font-size="20" fill="#1c2430">+</text>
<line class="c" x1="245" y1="360" x2="314" y2="360"/>
<rect class="bx" x="318" y="314" width="150" height="92" fill="#efecf6" stroke="#6a5a92" stroke-width="2"/>
<text x="393" y="362" class="ti">f</text>
<text x="393" y="386" class="ts">2 layers</text>
<line class="cp" x1="468" y1="360" x2="546" y2="360"/>
<rect class="bx" x="550" y="342" width="92" height="36" fill="#e8f3ed" stroke="#4e8c6a"/>
<text x="596.0" y="364.5" class="mono">y</text>
<text x="507" y="348" class="ts">× 1</text>
<rect class="bx" x="690" y="338" width="320" height="44" fill="#e8f3ed" stroke="#4e8c6a"/>
<text x="850.0" y="364.5" class="mono">y = f(y + z)</text>
<text x="690" y="398" class="ts" style="text-anchor:start">once per round</text>
<line x1="393" y1="226" x2="393" y2="312" stroke="#6a5a92" stroke-width="2" stroke-dasharray="5 4"/>
<rect class="bx" x="404" y="272" width="148" height="28" fill="#efecf6" stroke="#6a5a92"/>
<text x="478.0" y="290.5" class="t">same weights</text>
<text x="30" y="452" class="cap">Both f boxes are one network with one set of weights. Inputs are ADDED, never concatenated, so f's shape never changes.</text>
</svg>