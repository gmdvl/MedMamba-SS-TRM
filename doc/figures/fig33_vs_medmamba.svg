  .big {font-size:30px;font-weight:600;fill:#1c2430}
  .huge{font-size:38px;font-weight:600;fill:#1c2430}
  .mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:13.5px;fill:#1c2430}
  .monb{font-family:"SFMono-Regular",Consolas,monospace;font-size:13.5px;font-weight:600;fill:#1c2430}
</style></defs>
<rect width="1040" height="512" fill="#ffffff"/>
<text x="30" y="38" class="ti" style="text-anchor:start">Against a MedMamba baseline 8× its size</text>
<text x="30" y="60" class="tsub" style="text-anchor:start">Identical test patches, identical patient split, identical seed, batch size and GPU.</text>
<rect x="636" y="74" width="18" height="12" rx="3" fill="#ece9f3" stroke="#6a5a92" stroke-width="1.3"/>
<text x="662" y="85" class="ts" style="text-anchor:start">MedMamba-SS-TRM  (0.45 M)</text>
<rect x="836" y="74" width="18" height="12" rx="3" fill="#f2f4f7" stroke="#5a6472" stroke-width="1.3"/>
<text x="862" y="85" class="ts" style="text-anchor:start">MedMamba  (3.65 M)</text>
<text x="30" y="124" class="t" style="text-anchor:start">trainable parameters</text>
<rect x="400" y="104" width="400" height="18" rx="3" fill="#f2f4f7" stroke="#e3e6ea" stroke-width="0.8"/>
<rect x="400" y="104" width="48.87671232876713" height="18" rx="3" fill="#ece9f3" stroke="#6a5a92" stroke-width="1.3"/>
<text x="810" y="118" class="tsb" style="text-anchor:start">0.446 M</text>
<rect x="400" y="128" width="400" height="18" rx="3" fill="#f2f4f7" stroke="#e3e6ea" stroke-width="0.8"/>
<rect x="400" y="128" width="400.0" height="18" rx="3" fill="#dbe0e6" stroke="#5a6472" stroke-width="1.3"/>
<text x="810" y="142" class="ts" style="text-anchor:start">3.65 M</text>
<text x="950" y="124" class="ts" style="text-anchor:start;fill:#7b8794;font-size:11px">lower is better</text>
<text x="30" y="186" class="t" style="text-anchor:start">balanced accuracy</text>
<rect x="400" y="166" width="400" height="18" rx="3" fill="#f2f4f7" stroke="#e3e6ea" stroke-width="0.8"/>
<rect x="400" y="166" width="400.0" height="18" rx="3" fill="#ece9f3" stroke="#6a5a92" stroke-width="1.3"/>
<text x="810" y="180" class="tsb" style="text-anchor:start">90.73 %</text>
<rect x="400" y="190" width="400" height="18" rx="3" fill="#f2f4f7" stroke="#e3e6ea" stroke-width="0.8"/>
<rect x="400" y="190" width="382.4975201146258" height="18" rx="3" fill="#dbe0e6" stroke="#5a6472" stroke-width="1.3"/>
<text x="810" y="204" class="ts" style="text-anchor:start">86.76 %</text>
<text x="30" y="248" class="t" style="text-anchor:start">macro-F1</text>
<rect x="400" y="228" width="400" height="18" rx="3" fill="#f2f4f7" stroke="#e3e6ea" stroke-width="0.8"/>
<rect x="400" y="228" width="400.0" height="18" rx="3" fill="#ece9f3" stroke="#6a5a92" stroke-width="1.3"/>
<text x="810" y="242" class="tsb" style="text-anchor:start">0.858</text>
<rect x="400" y="252" width="400" height="18" rx="3" fill="#f2f4f7" stroke="#e3e6ea" stroke-width="0.8"/>
<rect x="400" y="252" width="385.92074592074596" height="18" rx="3" fill="#dbe0e6" stroke="#5a6472" stroke-width="1.3"/>
<text x="810" y="266" class="ts" style="text-anchor:start">0.828</text>
<text x="30" y="310" class="t" style="text-anchor:start">F1 on DCIS — the hard class</text>
<rect x="400" y="290" width="400" height="18" rx="3" fill="#f2f4f7" stroke="#e3e6ea" stroke-width="0.8"/>
<rect x="400" y="290" width="400.0" height="18" rx="3" fill="#ece9f3" stroke="#6a5a92" stroke-width="1.3"/>
<text x="810" y="304" class="tsb" style="text-anchor:start">0.704</text>
<rect x="400" y="314" width="400" height="18" rx="3" fill="#f2f4f7" stroke="#e3e6ea" stroke-width="0.8"/>
<rect x="400" y="314" width="361.93181818181824" height="18" rx="3" fill="#dbe0e6" stroke="#5a6472" stroke-width="1.3"/>
<text x="810" y="328" class="ts" style="text-anchor:start">0.637</text>
<text x="30" y="372" class="t" style="text-anchor:start">seconds / epoch</text>
<rect x="400" y="352" width="400" height="18" rx="3" fill="#f2f4f7" stroke="#e3e6ea" stroke-width="0.8"/>
<rect x="400" y="352" width="400.0" height="18" rx="3" fill="#ece9f3" stroke="#6a5a92" stroke-width="1.3"/>
<text x="810" y="366" class="ts" style="text-anchor:start">679 s</text>
<rect x="400" y="376" width="400" height="18" rx="3" fill="#f2f4f7" stroke="#e3e6ea" stroke-width="0.8"/>
<rect x="400" y="376" width="91.31075110456554" height="18" rx="3" fill="#dbe0e6" stroke="#5a6472" stroke-width="1.3"/>
<text x="810" y="390" class="tsb" style="text-anchor:start">155 s</text>
<text x="950" y="372" class="ts" style="text-anchor:start;fill:#7b8794;font-size:11px">lower is better</text>
<rect x="30" y="412" width="490" height="42" rx="7" fill="#e8f3ed" stroke="#4e8c6a" stroke-width="1.6"/>
<text x="275.0" y="438.5" class="t" style="text-anchor:middle">Leads every aggregate metric, at an eighth of the parameters.</text>
<rect x="540" y="412" width="470" height="42" rx="7" fill="#f8e7e2" stroke="#b4553f" stroke-width="1.6"/>
<text x="775.0" y="438.5" class="t" style="text-anchor:middle">And costs 4.4× the wall-clock to get there.</text>
<text x="520" y="486" class="tsb" style="text-anchor:middle">Read this as INDICATIVE, not controlled: the two models trained on differently balanced splits, and it is one seed.</text>
</svg>
