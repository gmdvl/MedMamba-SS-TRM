# MedMamba-SS-TRM test configuration (v17 S12). Before this, the suite had no config at all and
# ran only by accident of pytest's rootdir/sys.path defaults - see tests/conftest.py.
[pytest]
testpaths = tests
# Without this, collection walks 227 GB of data/ and 4.8 GB of experiments/ looking for
# tests, and would import the superseded entry points under archive/.
norecursedirs = archive data experiments paper ppt doc documentations plan .git *.egg-info
filterwarnings =
    ignore::DeprecationWarning:multiprocessing.popen_fork
